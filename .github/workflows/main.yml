name: shipping-quality-check

on:
  push:
    branches:
      - feature/vip-shipping
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Maven 构建与质量验证
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Show environment
        run: |
          set -e
          pwd
          java -version
          mvn -version
          git rev-parse HEAD
          test -f pom.xml

      - name: Build and verify with Maven
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BUILD_ARTIFACT
          path: target
